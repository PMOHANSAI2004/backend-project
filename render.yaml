services:
  - type: web
    name: backend-project
    runtime: node
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMERGENCY_NUMBER
        value: "112"
      - key: SEED_DEMO_DATA
        value: "true"
